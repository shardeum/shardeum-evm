syntax = "proto3";
package shardeum.validatorwhitelist.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/cosmos/evm/x/validatorwhitelist/types";

// Msg defines the validator whitelist Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  
  // UpdateWhitelist updates the validator whitelist
  rpc UpdateWhitelist(MsgUpdateWhitelist) returns (MsgUpdateWhitelistResponse);
  
  // AddValidator adds a validator to the whitelist
  rpc AddValidator(MsgAddValidator) returns (MsgAddValidatorResponse);
  
  // RemoveValidator removes a validator from the whitelist
  rpc RemoveValidator(MsgRemoveValidator) returns (MsgRemoveValidatorResponse);
}

// MsgUpdateWhitelist represents a message to update the entire whitelist
message MsgUpdateWhitelist {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "shardeum/validatorwhitelist/MsgUpdateWhitelist";

  // authority is the address of the governance account
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  
  // enabled indicates whether the whitelist is enabled
  bool enabled = 2;
  
  // allowlist is the list of allowed validator addresses
  repeated string allowlist = 3;
}

// MsgUpdateWhitelistResponse defines the response for MsgUpdateWhitelist
message MsgUpdateWhitelistResponse {}

// MsgAddValidator represents a message to add a validator to the whitelist
message MsgAddValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "shardeum/validatorwhitelist/MsgAddValidator";

  // authority is the address of the governance account
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  
  // validator is the validator address to add
  string validator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgAddValidatorResponse defines the response for MsgAddValidator
message MsgAddValidatorResponse {}

// MsgRemoveValidator represents a message to remove a validator from the whitelist
message MsgRemoveValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "shardeum/validatorwhitelist/MsgRemoveValidator";

  // authority is the address of the governance account
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  
  // validator is the validator address to remove
  string validator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRemoveValidatorResponse defines the response for MsgRemoveValidator
message MsgRemoveValidatorResponse {}